site_name: Template Documentation
site_description: A comprehensive documentation template with MkDocs
site_author: Your Name
site_url: https://your-domain.com

# Repository
repo_name: template-doc
repo_url: https://github.com/your-username/template-doc
edit_uri: edit/main/docs/

# Configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: your-username
      repo: template-doc
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
      timezone: UTC
      locale: en
      fallback_to_build_date: false
      exclude:
        - index.md
  - git-committers:
      repository: .
      branch: master
      docs_path: docs/
      enabled: false
      exclude:
        - index.md
  - with-pdf:
      author: Your Name
      copyright: Copyright © 2024 Your Organization
      cover: true
      back_cover: true
      cover_title: Template Documentation
      cover_subtitle: Comprehensive Documentation Template
      headless_chrome_path: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
      output_path: pdf/documentation.pdf
      enabled_if_env: ENABLE_PDF_EXPORT
      debug_html: false
      show_anchors: false
      verbose: false
      exclude_pages:
        - 'tags.md'
      convert_iframe:
        - src: IFRAME SRC
          img: POSTER IMAGE URL
          text: ALTERNATE TEXT
      two_columns_level: 3
      render_js: true
      custom_template_path: templates/
      ordered_chapter_level: 2
      excludes_children:
        - 'release-notes/:upgrading'
        - 'release-notes/:changelog'

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quick-start.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Overview: user-guide/overview.md
    - Features: user-guide/features.md
    - Best Practices: user-guide/best-practices.md
  - API Reference:
    - Introduction: api/introduction.md
    - Endpoints: api/endpoints.md
  - Contributing:
    - Guidelines: contributing/guidelines.md
    - Development: contributing/development.md
  - Changelog: changelog.md

# Extra
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-username/template-doc
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/your-handle
  generator: false
  analytics:
    provider: google
    property: G-XXXXXXXXXX

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
